services:
  - type: web
    name: tuwangapp-api
    runtime: go
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: go build -o server ./cmd/api
    startCommand: ./server
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GIN_MODE
        value: release
      - key: APP_TZ
        value: Asia/Jakarta
